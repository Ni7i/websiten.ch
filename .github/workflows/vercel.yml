# Bei jedem Push auf main die fertige Website (Ordner dist) auf Vercel veröffentlichen.
# Braucht das Repository-Secret VERCEL_TOKEN (GitHub: Settings > Secrets and variables > Actions).
# Optional: Repository-Variable VERCEL_SCOPE, falls das Projekt zu einem Vercel-Team gehört.
name: Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SCOPE: ${{ vars.VERCEL_SCOPE }}
    steps:
      - uses: actions/checkout@v5
      - name: Secret vorhanden?
        run: test -n "$VERCEL_TOKEN" || { echo "::error::Das Secret VERCEL_TOKEN fehlt im Repository."; exit 1; }
      - name: Vercel-CLI installieren
        run: npm install --global vercel@latest >/dev/null && vercel --version
      # Fehler werden als Annotation ausgegeben (eine Zeile), damit man sie ohne Log-Zugriff sieht
      - name: Mit dem Projekt beispiel13241324 verbinden
        run: |
          S=${SCOPE:+--scope $SCOPE}
          if ! out=$(vercel link --yes --project beispiel13241324 $S --token "$VERCEL_TOKEN" 2>&1); then
            echo "$out"
            who=$(vercel whoami --token "$VERCEL_TOKEN" 2>&1 | tail -n 1)
            teams=$(vercel teams ls --token "$VERCEL_TOKEN" 2>&1 | tail -n 6 | tr '\n' ' ')
            echo "::error::Link fehlgeschlagen: $(echo "$out" | tail -n 6 | tr '\n' ' ') | Konto: $who | Teams: $teams"
            exit 1
          fi
          echo "$out"
      - name: Veröffentlichen
        run: |
          S=${SCOPE:+--scope $SCOPE}
          if ! out=$(vercel deploy --prod --yes $S --token "$VERCEL_TOKEN" 2>&1); then
            echo "$out"; echo "::error::Deploy fehlgeschlagen: $(echo "$out" | tail -n 8 | tr '\n' ' ')"; exit 1
          fi
          echo "$out"
          echo "::notice::Deploy fertig: $(echo "$out" | grep -Eo 'https://[^ ]+' | tail -n 1)"
      # Live-Seite prüfen: neue Fassung online, Sicherheits-Header aktiv
      - name: Live-Seite prüfen
        run: |
          sleep 5
          B=https://beispiel13241324.vercel.app
          fail=""
          for p in index.html websites.html google-seo.html ueber-uns.html; do
            code=$(curl -s -o /tmp/p.html -w '%{http_code}' "$B/$p")
            [ "$code" = 200 ] || fail="$fail $p:$code"
          done
          curl -s "$B/index.html" | grep -q 'websiten-hero-m.mp4' || fail="$fail index:alte-Fassung"
          h=$(curl -sI "$B/index.html")
          echo "$h" | grep -qi '^content-security-policy:' || fail="$fail CSP-fehlt"
          echo "$h" | grep -qi '^strict-transport-security:' || fail="$fail HSTS-fehlt"
          size=$(curl -s "$B/index.html" | wc -c)
          if [ -n "$fail" ]; then echo "::error::Live-Prüfung:$fail"; exit 1; fi
          echo "::notice::Live-Prüfung ok: 4 Seiten erreichbar, neue Fassung, CSP und HSTS aktiv, Startseite $size Bytes"
